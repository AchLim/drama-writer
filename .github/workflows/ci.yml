name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every OS on the current Node, plus the oldest Node we develop on, on Linux only.
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
          - { os: ubuntu-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Keep generated marketplace files out of development
        if: github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
        run: node -e "if (require('child_process').execFileSync('git', ['ls-files', 'directory-plugin/'], {encoding:'utf8'}).trim()) { console.error('Generated marketplace files must not be tracked on develop'); process.exit(1) }"
      - name: Verify marketplace distribution for release
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'release/')))
        run: |
          git ls-files --error-unmatch directory-plugin/skills/drama-writer/SKILL.md
          node scripts/build-directory-plugin.mjs --check --require-output
      - run: npm run typecheck
      - run: npm test
